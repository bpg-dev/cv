profile:
  show: true
  order: 1
  title: Profile
  description: |
    Senior engineer with 25+ years across payments, cybersecurity, and cloud security — Go-first, with deep distributed systems and platform reliability background.
    Built core components of zero-downtime, multi-cloud systems processing billions of transactions annually for tier-one banks in the UK, US, and Canada.
    Sole maintainer of a widely adopted open-source Terraform provider (10M+ downloads); track record of mentoring engineers and leading high-performing teams.

experience:
  show: true
  order: 2
  title: Experiences

  items:
    - company: Paramount Commerce
      link: "https://paramountcommerce.com/"
      date: Apr 2025 - present
      role: Senior Software Engineer
      location: Toronto / remote
      description: |
        Paramount Commerce is a Toronto-based fintech offering instant bank-to-bank payments for iGaming, e-commerce, and remittance — $100B+ processed to date.

        - Core developer on payment gateway integrations with two Tier 1 Canadian banks — first gateway live in production, second in active development. Built authentication, caching, monitoring, and webhook-processing subsystems.
        - Build and extend the event-driven payment platform using **Golang**, **PostgreSQL**, **CockroachDB**, **Kafka**, **NATS**, and **Dragonfly**.
        - Cut CI/CD build times by 40% across 30+ services.
        - Operate 24/7 on-call rotation supporting 99.9% platform uptime.

    - company: Form3 Financial Cloud
      link: "https://form3.tech/"
      date: Jul 2022 - Mar 2025
      role: Lead Software Developer
      location: remote
      description: |
        Form3 is a cloud-native platform delivering real-time, account-to-account payment solutions for financial institutions.

        - Built core components of the **FedNow** and **TCH-RTP** integrations — including payment recall and reversal subsystems — now live in production.
        - Designed the idempotency layer enabling at-least-once delivery, improving end-to-end reliability.
        - Optimized **CockroachDB** access patterns and query latency, sustaining 150 TPS in core components.
        - Managed multi-cloud infrastructure (**AWS**, **GCP**, **Azure**) on **Kubernetes** with **Terraform**, **Flux**, and **Helm**; streamlined CI/CD on **GitHub Actions**.
        - Led four engineers; drove backlog prioritization and cross-team coordination.

    - company: Arctic Wolf Networks
      link: "https://arcticwolf.com/"
      date: Oct 2020 - Jun 2022
      role: Lead Software Developer
      location: remote
      description: |
        Arctic Wolf Networks is a cybersecurity company providing managed detection and response services.

        - Led migration of stateful EC2 backend to **EKS** using **Terraform** and **Python** IaC (ECR, S3, RDS, ElastiCache).
        - Scaled backend to **10K+ events/sec per node at 99.99% uptime** (**Golang**, **PostgreSQL**, **ElastiCache**).
        - Built CI/CD pipeline for the Arctic Wolf Agent software (**Golang**, **Python**, **GitHub Actions**, **Docker**).
        - Built cross-platform UAT framework, cutting release cycles from weeks to days (**Terraform**, **Packer**).
        - Mentored junior developers on daily work and career growth.

    - company: Street Contxt
      link: "https://streetcontxt.com/"
      date: Jan 2020 - Oct 2020
      role: Software Developer III
      location: Toronto
      description: |
        Street Contxt is a financial services platform providing tools for financial professionals.

        - Built event-streaming microservices (**Scala**, **Akka Streams**, **Kinesis**).
        - Migrated 20+ microservices to Scala 2.13; automated dependency updates (**sbt**, **GitHub Actions**).

    - company: Kooltra
      link: "https://kooltra.com/"
      date: Sep 2018 - Dec 2019
      role: Principal Software Engineer
      location: Toronto
      description: |
        Kooltra is a fintech company providing a cloud-based FX trading platform on Salesforce and AWS.

        - Architected **AWS Serverless** platform to offload EOD processing from Salesforce (**Java**, **Gradle**, **CircleCI**).
        - Mentored developers through lunch-and-learns and AWS best practices sessions.

    - company: Blue Coat Systems
      tags: acquired by Symantec for $4.65B in Jun 2016
      date: Jul 2015 - Sep 2018
      role: Principal Software Engineer
      location: North York
      description: |
        Blue Coat Systems was a cybersecurity company providing web gateway appliances and cloud security solutions.

        - Designed and led Service Provider Framework for ISP client onboarding (**Java**, **AWS Serverless**).
        - Migrated CDP persistence layer from RDBMS to **Cassandra** for distributed deployments.

    - company: Perspecsys
      # link: '#'
      tags: acquired by Blue Coat Systems for ~$200M in Jul 2015
      date: Jan 2012 - Jul 2015
      role: Senior Software Engineer
      location: Mississauga
      description: |
        Perspecsys was a cloud security startup providing an encryption gateway for SaaS applications.

        - Co-designed and built CDP Gateway core: distributed job engine (**Akka**), encryption (**JCE**), search (**Elasticsearch**), rules engine (**Drools**).
        - Established team best practices: TDD, code reviews, and quality monitoring (**SonarQube**).

    - company: Various companies
      date: 2000 - 2012
      role: Software Engineer / Senior Software Engineer / Team Lead
      location: Belarus & Canada
      description: |
        - **JVL Corporation** — Team Lead, Casino Class 3 Gaming Platform (Canada)
        - **NPP Belsoft** (Belarus)
        - **BelAZ** (Belarus)
